name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    name: Check (Rust + TypeScript)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npx tsc --noEmit

      - name: Build frontend (dist/ for Tauri context)
        run: npm run build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            src-tauri/target
          key: cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: cargo check
        working-directory: src-tauri
        run: cargo check
